<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Glühender Hof hinter dem Auto -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Auto-Icon (zentriert, Lucide-style) -->
  <g transform="translate(256, 256)" stroke="url(#amber)" stroke-width="22"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Körper -->
    <path d="M -110 30 L -90 -20 Q -80 -50 -50 -50 L 50 -50 Q 80 -50 90 -20 L 110 30"/>
    <!-- Boden -->
    <path d="M -110 30 L -130 30 L -130 70 L -100 70" />
    <path d="M 110 30 L 130 30 L 130 70 L 100 70" />
    <!-- Hauptkörper -->
    <path d="M -100 30 L 100 30 L 100 70 L -100 70 Z" fill="url(#amber)" opacity="0.15"/>
    <!-- Räder -->
    <circle cx="-65" cy="70" r="22" fill="#0b0b0d" stroke="url(#amber)" stroke-width="18"/>
    <circle cx="65" cy="70" r="22" fill="#0b0b0d" stroke="url(#amber)" stroke-width="18"/>
  </g>
</svg>
